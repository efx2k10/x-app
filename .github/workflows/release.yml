name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (MAJOR.MINOR.PATCH). Required for manual runs.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Resolve version from tag or input
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.version }}"
          fi

          VER="${TAG#v}"
          if ! [[ "$VER" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Version must look like v1.2.3 or 1.2.3, got '$TAG'"
            exit 1
          fi

          MAJ="${BASH_REMATCH[1]}"
          MIN="${BASH_REMATCH[2]}"
          PAT="${BASH_REMATCH[3]}"
          if [ "$MAJ" -gt 2000 ] || [ "$MIN" -gt 99 ] || [ "$PAT" -gt 99 ]; then
            echo "::error::Version '$VER' is out of the supported range"
            exit 1
          fi

          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :core:update-checker:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PversionName=${{ steps.version.outputs.name }} \
            -Pgithub.owner=${{ github.repository_owner }} \
            -Pgithub.repo=${{ github.event.repository.name }}

      - name: Verify signature and version
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)

          test -n "$APK"
          test -f "$APK"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^(package|application-label)"

          echo "$BADGING" | grep -q "versionCode='${{ steps.version.outputs.code }}'" || {
            echo "::error::APK versionCode does not match the tag"
            exit 1
          }
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.name }}'" || {
            echo "::error::APK versionName does not match the tag"
            exit 1
          }

      - name: Package artifacts
        run: |
          NAME="${{ steps.version.outputs.name }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          cp "$APK" "dist/app-$NAME.apk"
          cd dist
          sha256sum "app-$NAME.apk" > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.name }}
          files: |
            dist/app-${{ steps.version.outputs.name }}.apk
            dist/checksums.txt
